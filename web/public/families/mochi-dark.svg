<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img">
  <title>Mochi</title>
  <!--
    按 genmo.ai 字标里的三色 symbol 位图重绘（非官方矢量，无内嵌位图）。
    三张同尺寸圆角卡片沿 12.4° 斜切错位堆叠。蓝压黄的交叠区用实测混色填充，
    并用蓝卡形状做 clip —— 半透明叠加在深色主题下会随底色偏色，直角块则会露角。
  -->
  <defs>
    <clipPath id="mochi-blue">
      <rect x="2" y="32.56" width="38" height="36.5" rx="5"/>
    </clipPath>
  </defs>
  <g transform="translate(0.42 0.25) scale(0.2895) skewY(12.4)">
    <rect x="42" y="-6.64" width="36" height="36" rx="5" fill="#F03858"/>
    <rect x="22" y="12.76" width="38" height="36" rx="5" fill="#F8B820"/>
    <rect x="2" y="32.56" width="38" height="36.5" rx="5" fill="#3880F0"/>
    <rect x="22" y="32.56" width="18" height="16.2" fill="#507DCD" clip-path="url(#mochi-blue)"/>
  </g>
</svg>
