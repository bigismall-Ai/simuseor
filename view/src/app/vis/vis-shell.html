<div class="shell" [class.bare-shell]="bare()">
  <aside class="side" [class.collapsed]="collapsed()">
    <div class="brand-row">
      <a class="brand" routerLink="/vis/overview">
        <span class="brand-mark">VIS</span>
        <span class="brand-text">
          设计区
          <small>视觉与原型</small>
        </span>
      </a>
      <button
        type="button"
        class="collapse"
        [attr.aria-label]="collapsed() ? '展开左侧导航' : '收起左侧导航'"
        [attr.aria-expanded]="!collapsed()"
        (click)="toggleCollapsed()"
      >
        <span class="collapse-icon" aria-hidden="true">{{ collapsed() ? '»' : '«' }}</span>
      </button>
    </div>

    <ui-nav-tree
      [rows]="rows()"
      [collapsed]="collapsed()"
      activeRoute="{{ currentUrl() }}"
      (toggled)="toggleGroup($event)"
    />

    <div class="foot">
      <button
        type="button"
        class="theme-toggle"
        [attr.aria-label]="theme.theme() === 'dark' ? '切换到浅色主题' : '切换到深色主题'"
        [attr.aria-pressed]="theme.theme() === 'dark'"
        (click)="theme.toggle()"
      >
        <mat-icon
          class="theme-icon"
          [svgIcon]="theme.theme() === 'dark' ? 'app:sun' : 'app:moon'"
          aria-hidden="true"
        ></mat-icon>
        <span class="theme-label">{{ theme.theme() === 'dark' ? '浅色模式' : '深色模式' }}</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="page-shell" [class.framed-page]="framed()" [class.bare-page]="bare()">
      <div class="page-frame" [class.is-framed]="framed()">
        @if (!bare()) {
          <header class="page-frame-head">
            <app-page-crumb [label]="crumb()" />
          </header>
        }
        <div class="page-frame-body">
          <router-outlet />
        </div>
      </div>
    </div>
  </main>
</div>
